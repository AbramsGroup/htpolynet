# htpolynet -- Example 6 -- Bisphenol-A dicyanate ester (BADCy) thermoset
#
# This example builds the BADCy monomer in the style of example 2's GMA:
# the bisphenol-A core (BPA) and a small cyanate "end-group" (CY) are
# defined as SMILES building blocks, and the two param-stage reactions
# below stitch BPA + CY + CY into the full BCY constituent placed in the
# simulation box.  The cure stage then forms C-N bonds between cyanate
# end-groups on different BCYs; three such bonds among three monomers
# close into a 1,3,5-triazine ring (the characteristic crosslink of a
# cured cyanate-ester thermoset).
#
# Building-block notes:
#   - BPA: bisphenol-A, two phenolic O atoms (O1, O2) flagged reactive,
#     z=1 each.  Identical to BPA in example 2.
#   - CY: a one-carbon cyanate end-group drawn in its sp2 imino-formate
#     active form (formaldimine, H2C=NH).  The C atom carries z=2 (it
#     loses one sacrificial H when bonded to BPA's O during the build,
#     leaving one H reserved for the cure-stage C-N bond); the N atom
#     carries z=1 (untouched during build, reserved for cure).
#   - BCY: the assembled bisphenol-A dicyanate.  Built via the two
#     param-stage reactions cn-attach-1 and cn-attach-2 below; given a
#     count so it is the species inserted into the simulation box.
#     Each CY end-group inside a BCY carries z=1 on both C1 and N1
#     after the build, ready for cyanate-cyanate cure bonds.
#
# Ring closure: the cure-stage bondcycle-collective check is C-C-specific
# via the ChainManager (which only tracks vinyl-polymer C-C chains).
# Cyanate C and N atoms aren't in any C-C bondchain, so the heteroatom
# triazine ring (6 atoms, alternating C and N) is allowed to close
# unhindered after the third successive C-N bond among three monomers.
#
# Run with:
#
#   htpolynet run -diag diagnostics.log 6-cyanate-ester.yaml
#
# Cameron F. Abrams -- cfa22@drexel.edu

Title: Bisphenol-A dicyanate ester (BADCy) thermoset
gromacs:
  gmx: gmx
  gmx_options: -quiet -nobackup
  mdrun: gmx mdrun
  mdrun_options:
    gpu_id: 0            # auto-stripped at runtime if gmx is not GPU-capable or no GPU is visible
ambertools:
  charge_method: gas
constituents:
  # Building blocks (no count: consumed in the param-stage build only).
  BPA:
    smiles: "CC(c1ccc([OH:1])cc1)(c1ccc([OH:2])cc1)C"
    reactive_atoms: {1: O1, 2: O2}
  CY:
    # Formaldimine (H2C=NH) as the sp2 cyanate end-group.  The C has 2 H's
    # (one to lose on attachment to BPA's O, one reserved for the
    # eventual cure-stage C-N bond); the N has 1 H (also for cure).
    smiles: "[CH2:1]=[NH:2]"
    reactive_atoms: {1: C1, 2: N1}
  # Assembled monomer placed in the box.
  BCY:
    count: 100
densification:
  initial_density: 200.0  # kg/m3
  equilibration:
    - ensemble: min
    - ensemble: nvt
      temperature: 300
      ps: 10
    - ensemble: npt
      temperature: 300
      pressure: 10
      ps: 100
      repeat: 8
precure:
  preequilibration:
    ensemble: npt
    temperature: 300        # K
    pressure: 1             # bar
    ps: 200
  anneal:
    ncycles: 2
    initial_temperature: 300
    cycle_segments:
      - T: 300
        ps: 0
      - T: 500
        ps: 20
      - T: 500
        ps: 20
      - T: 300
        ps: 20
      - T: 300
        ps: 20
  postequilibration:
    ensemble: npt
    temperature: 300        # K
    pressure: 1             # bar
    ps: 100
CURE:
  controls:
    search_radius: 0.5          # nm
    radial_increment: 0.25      # nm
    min_bonds_per_iteration: 10
    max_iterations: 150
    desired_conversion: 0.90
    late_threshold: 0.80
  drag:
    trigger_distance: 0.6   # nm
    increment: 0.08         # nm
    limit: 0.3              # nm
    equilibration:
      - ensemble: min
      - ensemble: nvt
        temperature: 600
        nsteps: 1000
      - ensemble: npt
        temperature: 600
        pressure: 1
        nsteps: 2000
  relax:
    increment: 0.08         # nm
    equilibration:
      - ensemble: min
      - ensemble: nvt
        temperature: 600
        nsteps: 1000
      - ensemble: npt
        temperature: 600
        pressure: 1
        nsteps: 2000
  equilibrate:
    ensemble: npt
    temperature: 300       # K
    pressure: 1            # bar
    ps: 100
  gromacs:
    rdefault: 0.9          # nm
postcure:
  anneal:
    ncycles: 2
    initial_temperature: 300
    cycle_segments:
      - T: 300
        ps: 0
      - T: 500
        ps: 20
      - T: 500
        ps: 20
      - T: 300
        ps: 20
      - T: 300
        ps: 20
  postequilibration:
    ensemble: npt
    temperature: 300       # K
    pressure: 1            # bar
    ps: 100
reactions:
  # PARAM-stage: attach two cyanate end-groups (CY) to the two phenolic
  # oxygens of BPA.  Mirrors example 2's GMA = BPA + 2 HIE build.
  #
  #   cn-attach-1:  BPA.O1 + CY.C1 → BC1   (intermediate, one cyanate)
  #   cn-attach-2:  BC1.O2 + CY.C1 → BCY   (assembled bisphenol-A dicyanate)
  #
  # CY.C1 carries z=2 on the first attach (uses one sacrificial H,
  # reserves one for the cure-stage C-N bond) and z=1 on the second
  # (matches the post-decrement state of HIE.C4 in example 2's B2).
  - name: cn-attach-1
    stage: param
    reactants: {1: BPA, 2: CY}
    product: BC1
    atoms:
      A: {reactant: 1, resid: 1, atom: O1, z: 1}
      B: {reactant: 2, resid: 1, atom: C1, z: 2}
    bonds:
      - atoms: [A, B]
        order: 1
  - name: cn-attach-2
    stage: param
    reactants: {1: BC1, 2: CY}
    product: BCY
    atoms:
      A: {reactant: 1, resid: 1, atom: O2, z: 1}
      B: {reactant: 2, resid: 1, atom: C1, z: 1}
    bonds:
      - atoms: [A, B]
        order: 1
  # CURE-stage cyanate-cyanate polymerization.  Each event forms one
  # C-N bond between a CY end-group's C1 and another CY end-group's N1,
  # consuming one sacrificial H on each side.  Three such bonds among
  # three different BCY monomers close into the 1,3,5-triazine ring
  # (C-N-C-N-C-N).  The bondcycle-collective check is C-C-specific so
  # this heteroatom ring is allowed to close unhindered.  Following
  # example 2's idiom, the cure reactant is the small CY building block
  # (not BCY itself), so the parameterization template is a 2-residue
  # CY-CY dimer rather than a 6-residue BCY-BCY dimer.
  - name: cyclize
    stage: cure
    reactants: {1: CY, 2: CY}
    product: CY~C1-N1~CY
    probability: 1.0
    atoms:
      A: {reactant: 1, resid: 1, atom: C1, z: 1}
      B: {reactant: 2, resid: 1, atom: N1, z: 1}
    bonds:
      - atoms: [A, B]
        order: 1
