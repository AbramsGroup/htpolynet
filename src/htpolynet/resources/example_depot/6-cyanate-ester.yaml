# htpolynet -- Example 6 -- Bisphenol-A dicyanate ester (BADCy) thermoset
#
# Demonstrates cyclotrimerization chemistry: three cyanate ester groups
# (R-O-C≡N) cure into a 1,3,5-triazine ring -- a 6-membered aromatic
# ring with alternating C and N.  This is fundamentally a three-functional
# event, but htpolynet handles it as three successive pairwise C-N bond
# formations among three different monomers; the triazine ring closes
# naturally as the third bond forms.
#
# Active-form notes:
#   - Each cyanate -O-C≡N is drawn in its sp2 imino-formate active form
#     -O-C(H)=N(H), so each cure C-N bond consumes one sacrificial H
#     from each side (the standard htpolynet "lose 2H per bond" rule).
#     This is the same trick example 5 uses for IPDI's -N=C=O groups
#     (drawn as -N(H)-C(H)=O).
#   - Each BCY monomer has two cyanate ends.  Because BCY has C2 symmetry,
#     C1≡C2 and N1≡N2 chemically, but htpolynet looks up bond templates
#     by atom name, so the four C-N pairings (C1-N1, C1-N2, C2-N1, C2-N2)
#     between two BCY monomers are each given an explicit cure reaction.
#     The four resulting dimer templates are chemically equivalent but
#     differ in atom labels.
#   - The dimer template captures only the local environment of one new
#     C-N bond; the aromaticity of the closed triazine ring is left for
#     equilibration to relax into.  For a more rigorous treatment one
#     could pre-parameterize a model triazine via param-stage reactions
#     and let the cure machinery pick that up for ring-closing bonds.
#
# Ring closure: htpolynet's bondcycle suppression is C-C-specific (it
# tracks vinyl-polymer bondchains via the ChainManager).  Cyanate C and
# N atoms are not in any C-C bondchain, so bondcycle_collective skips
# them and the 6-atom triazine ring is allowed to close unhindered.
#
# Run with:
#
#   htpolynet run -diag diagnostics.log 6-cyanate-ester.yaml
#
# Cameron F. Abrams -- cfa22@drexel.edu

Title: Bisphenol-A dicyanate ester (BADCy) thermoset
gromacs:
  gmx: gmx
  gmx_options: -quiet -nobackup
  mdrun: gmx mdrun
  mdrun_options:
    gpu_id: 0            # auto-stripped at runtime if gmx is not GPU-capable or no GPU is visible
ambertools:
  charge_method: gas
constituents:
  BCY:
    # Bisphenol-A dicyanate.  Both -O-C≡N cyanates drawn in their active
    # sp2 imino-formate form -O-C(H)=N(H).  Each [CH:n] carries one H by
    # the SMILES bracket-atom rule, ditto each [NH:n].
    smiles: "CC(C)(c1ccc(O[CH:1]=[NH:2])cc1)c2ccc(O[CH:3]=[NH:4])cc2"
    reactive_atoms: {1: C1, 2: N1, 3: C2, 4: N2}
    count: 100
densification:
  initial_density: 200.0   # kg/m3
  equilibration:
    - ensemble: min
    - ensemble: nvt
      temperature: 300
      ps: 10
    - ensemble: npt
      temperature: 300
      pressure: 10
      ps: 100
      repeat: 8
precure:
  preequilibration:
    ensemble: npt
    temperature: 300        # K
    pressure: 1             # bar
    ps: 200
  anneal:
    ncycles: 2
    initial_temperature: 300
    cycle_segments:
      - T: 300
        ps: 0
      - T: 500
        ps: 20
      - T: 500
        ps: 20
      - T: 300
        ps: 20
      - T: 300
        ps: 20
  postequilibration:
    ensemble: npt
    temperature: 300        # K
    pressure: 1             # bar
    ps: 100
CURE:
  controls:
    search_radius: 0.5          # nm
    radial_increment: 0.25      # nm
    max_iterations: 150
    desired_conversion: 0.90
    late_threshold: 0.80
  drag:
    trigger_distance: 0.6   # nm
    increment: 0.08         # nm
    limit: 0.3              # nm
    equilibration:
      - ensemble: min
      - ensemble: nvt
        temperature: 600
        nsteps: 1000
      - ensemble: npt
        temperature: 600
        pressure: 1
        nsteps: 2000
  relax:
    increment: 0.08         # nm
    equilibration:
      - ensemble: min
      - ensemble: nvt
        temperature: 600
        nsteps: 1000
      - ensemble: npt
        temperature: 600
        pressure: 1
        nsteps: 2000
  equilibrate:
    ensemble: npt
    temperature: 300       # K
    pressure: 1            # bar
    ps: 100
  gromacs:
    rdefault: 0.9          # nm
postcure:
  anneal:
    ncycles: 2
    initial_temperature: 300
    cycle_segments:
      - T: 300
        ps: 0
      - T: 500
        ps: 20
      - T: 500
        ps: 20
      - T: 300
        ps: 20
      - T: 300
        ps: 20
  postequilibration:
    ensemble: npt
    temperature: 300       # K
    pressure: 1            # bar
    ps: 100
reactions:
  # CURE-stage cyanate-cyanate C-N bond formation.  Each event consumes
  # one sacrificial H from the cyanate C and one from the cyanate N;
  # three such bonds among three different BCY monomers form the
  # 1,3,5-triazine ring (C-N-C-N-C-N).  All four C-N atom pairings
  # between two BCY monomers are enumerated so atom-name lookup succeeds
  # regardless of which cyanate end of each monomer participates.
  - name: cn11
    stage: cure
    reactants: {1: BCY, 2: BCY}
    product: BCY~C1-N1~BCY
    probability: 1.0
    atoms:
      A: {reactant: 1, resid: 1, atom: C1, z: 1}
      B: {reactant: 2, resid: 1, atom: N1, z: 1}
    bonds:
      - atoms: [A, B]
        order: 1
  - name: cn12
    stage: cure
    reactants: {1: BCY, 2: BCY}
    product: BCY~C1-N2~BCY
    probability: 1.0
    atoms:
      A: {reactant: 1, resid: 1, atom: C1, z: 1}
      B: {reactant: 2, resid: 1, atom: N2, z: 1}
    bonds:
      - atoms: [A, B]
        order: 1
  - name: cn21
    stage: cure
    reactants: {1: BCY, 2: BCY}
    product: BCY~C2-N1~BCY
    probability: 1.0
    atoms:
      A: {reactant: 1, resid: 1, atom: C2, z: 1}
      B: {reactant: 2, resid: 1, atom: N1, z: 1}
    bonds:
      - atoms: [A, B]
        order: 1
  - name: cn22
    stage: cure
    reactants: {1: BCY, 2: BCY}
    product: BCY~C2-N2~BCY
    probability: 1.0
    atoms:
      A: {reactant: 1, resid: 1, atom: C2, z: 1}
      B: {reactant: 2, resid: 1, atom: N2, z: 1}
    bonds:
      - atoms: [A, B]
        order: 1
