name: Build and push Docker image

on:
  push:
    tags:
      - "v*"
      - "d*"
  schedule:
    # Rebuild weekly (Monday 03:00 UTC) to pick up latest Gromacs/AmberTools
    - cron: '0 3 * * 1'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default image.  conda-forge's preferred linux-64 Gromacs is the
          # OpenCL build, which cannot drive NVIDIA devices; this image is
          # CPU-only by design and stays the default so `docker run` on a
          # laptop keeps working without pulling the CUDA toolkit.
          - variant: cpu
            gromacs_build: ""
            cuda_override: ""
            tag_prefix: ""
          # The CUDA image.  gromacs=*=nompi_cuda* depends on the __cuda
          # virtual package, which conda synthesizes only where an NVIDIA
          # driver is present -- so the solve fails on this runner unless
          # CONDA_OVERRIDE_CUDA declares one.  That makes the image buildable
          # here; it does NOT make it verifiable here.  Nothing in CI can
          # confirm that mdrun actually offloads, so smoke-test a new CUDA
          # image on real hardware before recommending it.
          - variant: cuda
            gromacs_build: "nompi_cuda"
            cuda_override: "12.9"
            tag_prefix: "cuda-"
    steps:
    - uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Compute tags
      id: tags
      env:
        REF_NAME: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        repo="ghcr.io/cameronabrams/htpolynet"
        prefix="${{ matrix.tag_prefix }}"
        if [ "${{ matrix.variant }}" = "cuda" ]; then
          moving="$repo:cuda"
        else
          moving="$repo:latest"
        fi
        {
          echo "tags<<EOF"
          echo "$moving"
          echo "$repo:${prefix}${{ github.sha }}"
          # A release also gets a tag people can *guess*.  Until now the only
          # stable name was the commit sha, so `pull ...:v2.6.0` failed with
          # `manifest unknown` -- which reads like the build failed rather than
          # like the tag is named something else.  Emit both spellings, the git
          # tag as written and the bare version, because there is no way for a
          # user to know which convention this registry chose.  A `d*` tag is a
          # Dockerfile-only rebuild, not a release, so it gets neither.
          if [ "$REF_TYPE" = "tag" ]; then
            case "$REF_NAME" in
              v*)
                echo "$repo:${prefix}${REF_NAME}"
                echo "$repo:${prefix}${REF_NAME#v}"
                ;;
            esac
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        push: true
        build-args: |
          HTPOLYNET_COMMIT=${{ github.sha }}
          GROMACS_BUILD=${{ matrix.gromacs_build }}
          CONDA_OVERRIDE_CUDA=${{ matrix.cuda_override }}
        tags: ${{ steps.tags.outputs.tags }}
